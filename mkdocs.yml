site_name: Docs

repo_url: https://github.com/thdlrt/CsNotes
repo_name: thdlrt/CsNotes

theme:
    logo: https://thdlrt.oss-cn-beijing.aliyuncs.com/android-chrome-512x512.png
    name: 'material'
    icon:
      repo: fontawesome/brands/github
    features:
      - content.code.select
      - navigation.tabs
      - search.suggest
      - search.share
      - navigation.top
    palette:

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# Extensions
markdown_extensions:
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - toc:
      permalink: true

plugins:
  - search
  - roamlinks

nav:
  - index.md
  - 01_文档:
    - 01_学术:
      - 01_代码: 01_文档/01_学术/01_代码/index.md
      - 02_基础课程: 01_文档/01_学术/02_基础课程/index.md
      - 03_选修课程: 01_文档/01_学术/03_选修课程/index.md
      - 04_计算机课程: 01_文档/01_学术/04_计算机课程/index.md
    - 02_实用: 01_文档/02_实用/index.md
    - 03_工具类: 01_文档/03_工具类/index.md
    - 04_生活: 01_文档/04_生活/index.md
  - 02_如何做: 02_如何做/index.md
  - 03_产品: 03_产品/index.md
  - 04_工具: 04_工具/index.md

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js
